<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin — {% block title %}{% endblock %}</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;font-size:14px;background:#f5f5f5;color:#1a1a1a}
nav{background:#1a1a1a;padding:0 24px;display:flex;align-items:center;gap:24px;height:48px}
nav a{color:#ccc;text-decoration:none;font-size:13px}
nav a:hover,nav a.active{color:#fff}
nav .logo{color:#fff;font-weight:600;margin-right:16px}
main{padding:24px;max-width:1100px}
h1{font-size:20px;font-weight:600;margin-bottom:20px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:28px}
.card{background:#fff;border:1px solid #e0e0e0;border-radius:8px;padding:16px}
.card .label{font-size:12px;color:#666;margin-bottom:6px}
.card .value{font-size:28px;font-weight:600}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid #e0e0e0;border-radius:8px;overflow:hidden}
th{background:#f0f0f0;text-align:left;padding:10px 14px;font-size:12px;font-weight:600;color:#444}
td{padding:9px 14px;border-top:1px solid #eee;font-size:13px;color:#333}
tr:hover td{background:#fafafa}
.pill{display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:600}
.pill-green{background:#dcfce7;color:#166534}
.pill-red{background:#fee2e2;color:#991b1b}
.pill-gray{background:#f1f5f9;color:#475569}
.pill-blue{background:#dbeafe;color:#1e40af}
.pill-yellow{background:#fef9c3;color:#854d0e}
.pill-teal{background:#ccfbf1;color:#0f766e}
.refresh{font-size:12px;color:#888;margin-bottom:12px}
</style>
</head>
<body>
<nav>
  <span class="logo">Admin</span>
  <a href="/dashboard" {% if active=='activity' %}class="active"{% endif %}>Live activity</a>
  <a href="/dashboard/stats" {% if active=='stats' %}class="active"{% endif %}>User stats</a>
  <a href="/dashboard/stream" {% if active=='stream' %}class="active"{% endif %}>De-identified stream</a>
</nav>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
